# BFHelper 全局配置文件
# 首次启动会自动生成，按需修改后重启

# 运行模式: remilia（默认）
mode: remilia

# Remilia 模式配置（OneBot 正向 WebSocket）
remilia:
  ws_server: "ws://127.0.0.1:6700"
  ws_token: ""
  super_users:          # 机器人超级管理员 QQ
    - 123456

# 插件专属配置（remilia 框架约定: plugins.<插件名>）
plugins:
  bfhelper:
    # 机器人超级管理员 QQ（可执行登录/登出，并绕过群内权限检查）
    super_users:
      - 123456

    # EA 账号凭据（从浏览器 cookie 中提取）
    account:
      sid: ""              # EA sid cookie
      remid: ""            # EA remid cookie
      game: "bf1"          # bf1 | bfv | bf4 | bf2042 | bf6

    # BFEAC 反作弊查询配置
    bfeac:
      api_key: ""          # BFEAC API 密钥（可选）

    # Blaze TCP 实时推送
    blaze:
      enabled: false
