version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - errcheck
    - exhaustive
    - gocritic
    - gocyclo
    - goprintffuncname
    - govet
    - ineffassign
    - makezero
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - "(io.Closer).Close"
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    rules:
      - text: 'identifier ".*" contain non-ASCII character: U\+.*'
        linters: [revive]
      - path: _test\.go
        linters: [errcheck, gocritic]

formatters:
  enable:
    - gofmt
    - goimports
